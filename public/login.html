<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Masuk ke Monetra Tracker dengan akun Google untuk mengelola keuangan keluarga.">
  <title>Masuk - Monetra Tracker</title>
  <link rel="stylesheet" href="/css/marketing.css">
</head>
<body>
  <main class="auth">
    <section class="auth-panel" aria-label="Masuk">
      <div class="login-card">
        <a class="brand login-brand" href="/">
          <span class="brand-mark">M</span>
          <span>Monetra Tracker</span>
        </a>

        <h1>Selamat Datang Kembali</h1>
        <p class="login-subtitle">Masuk untuk melanjutkan pengelolaan keuangan Anda.</p>

        <div class="notice notice-offline" id="offline" role="status" hidden>Koneksi internet diperlukan untuk masuk. Periksa jaringan Anda, lalu coba lagi.</div>
        <div class="notice notice-error" id="error" role="alert" hidden></div>

        <button class="google-btn" id="btn-google" type="button">
          <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65Z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19Z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
          </svg>
          <span id="btn-label">Lanjutkan dengan Google</span>
        </button>

        <p class="status" id="status" aria-live="polite"></p>
        <p class="privacy-note">Masuk memakai akun Google Anda. Kami tidak menyimpan kata sandi di aplikasi ini.</p>
        <a class="back-link" href="/">Kembali ke Beranda</a>
      </div>
    </section>
  </main>

  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
